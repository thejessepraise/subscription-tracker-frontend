<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Subscription Tracker</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- =========================
             TOP BAR
        ========================== -->

        <header class="top-bar">

            <p class="app-label">
                SUBSCRIPTION TRACKER
            </p>

            <button class="header-button">
                <i class="fa-regular fa-bell"></i>
            </button>

        </header>


        <!-- =========================
             SPENDING
        ========================== -->

        <section class="spending-section">

            <div class="spending-header">

                <div>

                    <h1 id="totalSpending">
                        $0.00
                    </h1>

                    <p>
                        Your spendings
                    </p>

                </div>


                <select id="periodSelect">

                    <option value="all">
                        All time
                    </option>

                    <option value="month">
                        This month
                    </option>

                </select>

            </div>


            <!-- =========================
                 CHART
            ========================== -->

            <div class="chart">

                <div class="chart-bars">

                    <div class="bar-wrapper">

                        <div
                            class="bar"
                            data-height="25"
                        ></div>

                        <span>Apr</span>

                    </div>


                    <div class="bar-wrapper">

                        <div
                            class="bar"
                            data-height="45"
                        ></div>

                        <span>May</span>

                    </div>


                    <div class="bar-wrapper">

                        <div
                            class="bar"
                            data-height="70"
                        ></div>

                        <span>Jun</span>

                    </div>


                    <div class="bar-wrapper">

                        <div
                            class="bar active"
                            data-height="100"
                        ></div>

                        <span class="active-month">
                            Jul
                        </span>

                    </div>


                    <div class="bar-wrapper">

                        <div
                            class="bar"
                            data-height="55"
                        ></div>

                        <span>Aug</span>

                    </div>


                    <div class="bar-wrapper">

                        <div
                            class="bar"
                            data-height="80"
                        ></div>

                        <span>Sep</span>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             HISTORY
        ========================== -->

        <section class="history">

            <div class="section-header">

                <h2>History</h2>

                <button id="seeAllBtn">
                    See all
                </button>

            </div>


            <div id="subscriptionList"></div>

        </section>


        <!-- =========================
             ADD BUTTON
        ========================== -->

        <button
            class="add-button"
            id="addBtn"
            title="Add subscription"
        >
            <i class="fa-solid fa-plus"></i>
        </button>

    </main>


    <!-- =========================
         ADD / EDIT MODAL
    ========================== -->

    <div
        class="modal hidden"
        id="subscriptionModal"
    >

        <div class="modal-content">

            <h2 id="modalTitle">
                Add Subscription
            </h2>


            <label for="serviceInput">
                Service
            </label>

            <input
                type="text"
                id="serviceInput"
                placeholder="Netflix"
            >


            <label for="planInput">
                Plan
            </label>

            <input
                type="text"
                id="planInput"
                placeholder="Premium"
            >


            <label for="priceInput">
                Price
            </label>

            <input
                type="number"
                id="priceInput"
                placeholder="15.99"
                step="0.01"
                min="0"
            >


            <label for="dateInput">
                Billing date
            </label>

            <input
                type="date"
                id="dateInput"
            >


            <div class="modal-actions">

                <button
                    class="cancel-button"
                    id="cancelBtn"
                >
                    Cancel
                </button>


                <button
                    class="save-button"
                    id="saveBtn"
                >
                    Save
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
